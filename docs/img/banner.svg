e UI,Helvetica,Arial,sans-serif">Order book</text><text x="16" y="96" fill="#0F172A" font-size="40" font-weight="700" font-family="Segoe UI,Helvetica,Arial,sans-serif">R1 240</text><text x="16" y="118" fill="#64748B" font-size="13" font-family="Segoe UI,Helvetica,Arial,sans-serif">today, 14 orders</text><line x1="16" y1="136" x2="180" y2="136" stroke="#E2E8F0"/><text x="16" y="160" fill="#0F172A" font-size="14" font-weight="600" font-family="Segoe UI,Helvetica,Arial,sans-serif">Works offline</text><text x="16" y="178" fill="#64748B" font-size="12.5" font-family="Segoe UI,Helvetica,Arial,sans-serif">syncs when the signal is back</text></g><g transform="translate(1062,56)"><rect width="196" height="206" rx="16" fill="#F8FAFC"/><rect width="196" height="44" rx="16" fill="#1E293B"/><rect y="28" width="196" height="16" fill="#1E293B"/><text x="16" y="29" fill="#ffffff" font-size="17" font-weight="700" font-family="Segoe UI,Helvetica,Arial,sans-serif">Suppliers</text><text x="16" y="76" fill="#0F172A" font-size="14.5" font-weight="600" font-family="Segoe UI,Helvetica,Arial,sans-serif">Soweto Cash &amp; Carry</text><text x="16" y="93" fill="#64748B" font-size="12.5" font-family="Segoe UI,Helvetica,Arial,sans-serif">2 km &#183; sells what you buy</text><line x1="16" y1="104" x2="180" y2="104" stroke="#E2E8F0"/><text x="16" y="118" fill="#0F172A" font-size="14.5" font-weight="600" font-family="Segoe UI,Helvetica,Arial,sans-serif">Mahlangu Wholesale</text><text x="16" y="135" fill="#64748B" font-size="12.5" font-family="Segoe UI,Helvetica,Arial,sans-serif">5 km &#183; pays by card</text><line x1="16" y1="146" x2="180" y2="146" stroke="#E2E8F0"/><text x="16" y="160" fill="#0F172A" font-size="14.5" font-weight="600" font-family="Segoe UI,Helvetica,Arial,sans-serif">Kasi Bakers</text><text x="16" y="177" fill="#64748B" font-size="12.5" font-family="Segoe UI,Helvetica,Arial,sans-serif">7 km &#183; delivers</text><line x1="16" y1="188" x2="180" y2="188" stroke="#E2E8F0"/></g>
